apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tickets-service
  template:
    metadata:
      labels:
        app: tickets-service
    spec:
      containers:
        - name: tickets-service
          image: stephendinh/booking-system-ticket-api:7
          command: ['node', 'dist/apps/tickets/main']
          ports:
            - containerPort: 3001
          env:
            - name: REDIS_HOST
              value: 'redis'
            - name: REDIS_PORT
              value: '6379'
            - name: DB_HOST
              value: 'mysql'
            - name: DB_PORT
              value: '3306'
            - name: DB_USERNAME
              value: 'root'
            - name: DB_PASSWORD
              value: 'admin123'
            - name: DB_DATABASE
              value: 'booking_tickets'

---
apiVersion: v1
kind: Service
metadata:
  name: tickets-service
spec:
  selector:
    app: tickets-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: LoadBalancer
