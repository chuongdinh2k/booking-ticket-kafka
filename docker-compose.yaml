services: 
  orders-taker: 
    build: 
      context: .
      dockerfile: ./apps/orders-taker/Dockerfile
      target: development
    command: npm run start:dev orders-taker
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - kafka
      - mysql
      - redis
    environment:
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - booking-ticket
    deploy:
      resources:
        limits:
          cpus: '0.5' # Limit to 0.5 CPU cores
          memory: 256M # Limit to 256MB of RAM
  orders-processor: 
    build:
      context: .
      dockerfile: ./apps/order-processor/Dockerfile
      target: development
    command: npm run start:dev order-processor
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "9100:9100" # Map port 9100 for Prometheus metrics
    depends_on:
      - kafka
      - mysql
      - redis
    environment:
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - booking-ticket

  orders-processor-2: 
    build:
      context: .
      dockerfile: ./apps/order-processor/Dockerfile
      target: development
    command: npm run start:dev order-processor
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "9101:9100" # Map port 9101 for Prometheus metrics
    depends_on:
      - kafka
      - mysql
      - redis
    environment:
      KAFKA_BROKER: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - booking-ticket

  tickets-service: 
    build: 
      context: .
      dockerfile: ./apps/tickets/Dockerfile
      target: development
    command: npm run start:dev tickets
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "3001:3001"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.5'    # Limit to 0.5 CPU cores
          memory: 512M   # Limit to 512MB of memory
    networks:
      - booking-ticket
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - booking-ticket

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://192.168.1.6:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - booking-ticket

  kafdrop:
    image: obsidiandynamics/kafdrop:4.1.0
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - kafka
    networks:
      - booking-ticket

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: booking_tickets
      MYSQL_USER: chuong
      MYSQL_PASSWORD: chuong123
    ports:
      - "3307:3306"
    networks:
      - booking-ticket

  redis:
    image: redis
    ports:
      - "6378:6379"
    networks:
      - booking-ticket
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # prometheus:
  #   image: prom/prometheus:v3.2
  #   container_name: booking-ticket-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./monitoring/prometheus.yaml:/etc/prometheus.yaml
networks:
  booking-ticket:
    driver: bridge